<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin</title><link rel="stylesheet" href="/app.css"/>
</head><body class="desk-body">
<header class="desk-top">
  <a class="brand" href="/"><span class="logo">iV</span> INSTANT <b>VIRTUALS</b></a>
  <div class="desk-actions">
    <a class="pill-link" href="/app.html">Desk</a>
    <button class="pill-link" id="out">Out</button>
  </div>
</header>
<main class="desk">
  <p class="desk-hi">Admin</p>
  <p class="desk-sub">Control room</p>
  <div class="admin-tabs">
    <button class="tab on" data-tab="overview">Home</button>
    <button class="tab" data-tab="users">Users</button>
    <button class="tab" data-tab="pays">Pay</button>
    <button class="tab" data-tab="tips">Tips</button>
    <button class="tab" data-tab="slips">Slips</button>
    <button class="tab" data-tab="content">Site</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>
  <div class="notice">Mark paid after a real MoMo screenshot. Then that user can open Predictions.</div>
  <section id="overview" class="panel">
    <div class="desk-kpis">
      <div><small>USERS</small><b id="oUsers">0</b></div>
      <div><small>PENDING</small><b id="oPending">0</b></div>
      <div><small>SLIPS</small><b id="oSlips">0</b></div>
    </div>
  </section>
  <section id="users" class="panel hidden"><div class="desk-card"><div class="desk-label">MEMBERS</div><h2>Users</h2><div id="userTable"></div></div></section>
  <section id="pays" class="panel hidden"><div class="desk-card glow"><div class="desk-label">MONEY</div><h2>Payment proofs</h2><div id="payTable"></div></div></section>
  <section id="tips" class="panel hidden"><div class="desk-card glow">
    <div class="desk-label">PUBLISH</div><h2>Desk tip</h2>
    <div class="field"><label>Match</label><input id="tMatch"/></div>
    <div class="field"><label>Selection</label><input id="tSel"/></div>
    <div class="field"><label>Odd</label><input id="tOdd"/></div>
    <div class="field"><label>Note</label><input id="tNote"/></div>
    <button class="btn btn-orange block" id="pub">Publish</button>
    <div id="tipTable" style="margin-top:16px"></div>
  </div></section>
  <section id="slips" class="panel hidden"><div class="desk-card"><div class="desk-label">HISTORY</div><h2>User slips</h2><div id="slipTable"></div></div></section>
  <section id="content" class="panel hidden"><div class="desk-card">
    <div class="desk-label">HOMEPAGE</div><h2>Site content</h2>
    <div class="field"><label>Ticker (one per line)</label><textarea id="cTicker" rows="4"></textarea></div>
    <div class="field"><label>Testimonials JSON</label><textarea id="cReviews" rows="6"></textarea></div>
    <div class="field"><label>Displayed count</label><input id="cWin" type="number"/></div>
    <div class="field"><label>Displayed total won</label><input id="cTot" type="number"/></div>
    <div class="field"><label>Win rate label</label><input id="cRate"/></div>
    <button class="btn btn-orange block" id="saveContent">Save content</button>
  </div></section>
  <section id="settings" class="panel hidden"><div class="desk-card glow">
    <div class="desk-label">PAYOUT</div><h2>Settings</h2>
    <div class="field"><label>Site name</label><input id="sName"/></div>
    <div class="field"><label>Tagline</label><input id="sTag"/></div>
    <div class="field"><label>Support link</label><input id="sSup"/></div>
    <div class="field"><label>Fee GHS (exact send amount)</label><input id="sGhs" type="number"/></div>
    <div class="field"><label>Fee GHS shown on country list</label><input id="sGhsShow" type="number"/></div>
    <div class="field"><label>Fee NGN</label><input id="sNgn" type="number"/></div>
    <div class="field"><label>MoMo network</label><input id="sNet"/></div>
    <div class="field"><label>Your MoMo number</label><input id="sNum"/></div>
    <div class="field"><label>Account name</label><input id="sAcc"/></div>
    <div class="field"><label>Other country Telegram link</label><input id="sTg"/></div>
    <div class="field"><label>Require fee</label><select id="sFee"><option value="yes">Yes</option><option value="no">No</option></select></div>
    <div class="field"><label>Require approval</label><select id="sAppr"><option value="yes">Yes</option><option value="no">No</option></select></div>
    <div class="field"><label>Maintenance</label><select id="sMaint"><option value="no">Off</option><option value="yes">On</option></select></div>
    <div class="field"><label>Disclaimer</label><textarea id="sDisc" rows="5"></textarea></div>
    <button class="btn btn-orange block" id="saveSet">Save settings</button>
  </div></section>
</main>
<script src="/api.js"></script>
<script>
function show(tab){document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));document.getElementById(tab).classList.remove("hidden");}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("on"));b.classList.add("on");show(b.dataset.tab);});
async function refresh(){
  const me=await api("/api/me").catch(()=>null);
  if(!me || me.user.role!=="admin"){ location.href="/login.html"; return; }
  const o=await api("/api/admin/overview");
  document.getElementById("oUsers").textContent=o.users;
  document.getElementById("oPending").textContent=o.pending;
  document.getElementById("oSlips").textContent=o.slips;
  const {users}=await api("/api/admin/users");
  document.getElementById("userTable").innerHTML=`<table class="table"><tr><th>Name</th><th>Email</th><th>Status</th><th>Paid</th><th>Credits</th><th></th></tr>${
    users.map(u=>`<tr><td>${u.name}<br><small>${u.role}</small></td><td>${u.email}<br><small>${u.phone||""}</small></td><td><span class="badge ${u.status==="active"?"ok":"wait"}">${u.status}</span></td><td>${u.paid?"yes":"no"}</td><td>${u.credits}</td><td>${u.role==="admin"?"—":`
      <button class="btn btn-green" onclick="act('${u.id}','approve')">Approve</button>
      <button class="btn btn-line" onclick="act('${u.id}','paid')">Mark paid</button>
      <button class="btn btn-line" onclick="act('${u.id}','credit')">+5</button>
      <button class="btn btn-danger" onclick="act('${u.id}','block')">Block</button>`}</td></tr>`).join("")}</table>`;
  const {picks}=await api("/api/picks");
  document.getElementById("tipTable").innerHTML=picks.length?`<table class="table"><tr><th>Match</th><th>Tip</th><th>Odd</th><th>Note</th></tr>${picks.map(p=>`<tr><td>${p.match}</td><td>${p.selection}</td><td>${p.odd||""}</td><td>${p.note||""}</td></tr>`).join("")}</table>`:"<p class='sub'>None</p>";
  const {slips}=await api("/api/admin/slips");
  document.getElementById("slipTable").innerHTML=slips.length?`<table class="table"><tr><th>User</th><th>When</th><th>File</th><th>Fixtures</th></tr>${slips.map(s=>`<tr><td>${s.user_name||""}<br><small>${s.user_email||""}</small></td><td>${new Date(s.created_at).toLocaleString()}</td><td>${s.image_name||"—"}</td><td>${(s.fixtures||[]).map(f=>f.home+" vs "+f.away).join("<br>")}</td></tr>`).join("")}</table>`:"<p class='sub'>None</p>";
  const s=me.settings;
  document.getElementById("cTicker").value=(s.ticker||[]).join("\n");
  document.getElementById("cReviews").value=JSON.stringify(s.testimonials||[],null,2);
  document.getElementById("cWin").value=s.stats.winners;
  document.getElementById("cTot").value=s.stats.totalWon;
  document.getElementById("cRate").value=s.stats.winRateLabel;
  document.getElementById("sName").value=s.siteName;
  document.getElementById("sTag").value=s.tagline;
  document.getElementById("sSup").value=s.supportLink;
  document.getElementById("sGhs").value=s.registrationFeeGHS;
  document.getElementById("sGhsShow").value=s.registrationFeeDisplayGHS||50;
  document.getElementById("sNgn").value=s.registrationFeeNGN;
  document.getElementById("sNet").value=s.momoNetwork||"";
  document.getElementById("sNum").value=s.momoNumber||"";
  document.getElementById("sAcc").value=s.momoName||"";
  document.getElementById("sTg").value=s.telegramPay||"";
  const pays=(await api("/api/admin/payments").catch(()=>({payments:[]}))).payments||[];
  document.getElementById("payTable").innerHTML=pays.length?`<table class="table"><tr><th>User</th><th>Amount</th><th>Sender</th><th>From</th><th>Tx</th><th></th></tr>${pays.map(p=>`<tr><td>${p.user_name||""}<br><small>${p.user_email||""}</small></td><td>${p.currency} ${p.amount}<br><small>${p.status}</small></td><td>${p.senderName||""}</td><td>${p.payerNumber||""}</td><td>${p.txId||"—"}</td><td>${p.user_id?`<button class="btn btn-green" onclick="act('${p.user_id}','paid')">Mark paid</button>`:""}</td></tr>`).join("")}</table>`:"<p class='sub'>No proofs yet.</p>";
  document.getElementById("sFee").value=s.requireFee?"yes":"no";
  document.getElementById("sAppr").value=s.requireApproval?"yes":"no";
  document.getElementById("sMaint").value=s.maintenance?"yes":"no";
  document.getElementById("sDisc").value=s.disclaimer;
}
window.act=async(id,action)=>{ await api("/api/admin/users/"+id+"/action",{method:"POST",body:{action}}); refresh(); };
document.getElementById("pub").onclick=async()=>{
  await api("/api/admin/picks",{method:"POST",body:{
    match:tMatch.value,selection:tSel.value,odd:tOdd.value,note:tNote.value
  }}); refresh();
};
document.getElementById("saveContent").onclick=async()=>{
  let testimonials; try{testimonials=JSON.parse(document.getElementById("cReviews").value);}catch{alert("Bad JSON");return;}
  await api("/api/admin/content",{method:"POST",body:{
    ticker:document.getElementById("cTicker").value.split("\n").map(s=>s.trim()).filter(Boolean),
    testimonials,
    stats:{winners:Number(cWin.value||0),totalWon:Number(cTot.value||0),winRateLabel:cRate.value}
  }}); alert("Saved");
};
document.getElementById("saveSet").onclick=async()=>{
  try{
  await api("/api/admin/settings",{method:"POST",body:{
    siteName:sName.value,tagline:sTag.value,supportLink:sSup.value,
    registrationFeeGHS:Number(sGhs.value),registrationFeeDisplayGHS:Number(sGhsShow.value),registrationFeeNGN:Number(sNgn.value),
    momoNetwork:sNet.value,momoNumber:sNum.value,momoName:sAcc.value,telegramPay:sTg.value,
    requireFee:sFee.value==="yes",requireApproval:sAppr.value==="yes",maintenance:sMaint.value==="yes",
    disclaimer:sDisc.value
  }}); alert("Saved. If the site sleeps on Render, set the same values in Render Environment so they come back.");
  }catch(err){ alert(err.message || "Save failed"); }
};
document.getElementById("out").onclick=async()=>{ await api("/api/logout",{method:"POST"}); location.href="/"; };
refresh();
</script>
</body></html>
