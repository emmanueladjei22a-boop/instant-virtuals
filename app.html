<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Desk</title><link rel="stylesheet" href="/app.css"/>
</head><body>
<div class="app-shell">
<aside class="side">
  <a class="brand" href="/"><span class="logo">iV</span> INSTANT <b>VIRTUALS</b></a>
  <div style="height:18px"></div>
  <a class="active" href="/app.html">My desk</a>
  <a id="adminLink" class="hidden" href="/admin.html">Admin panel</a>
  <button class="linkish" id="out">Log out</button>
</aside>
<main class="main">
  <div class="topbar">
    <div><h2 id="hello">Dashboard</h2><p class="sub" style="margin:0" id="meta"></p></div>
    <a class="btn btn-line" id="support" target="_blank">Support</a>
  </div>
  <div class="notice" id="gate"></div>
  <div class="grid-3">
    <div class="card kpi">Status<strong id="kStatus">—</strong></div>
    <div class="card kpi">Credits<strong id="kCredits">0</strong></div>
    <div class="card kpi">Slips<strong id="kSlips">0</strong></div>
  </div>
  <div style="height:18px"></div>
  <div class="grid-2">
    <section class="card">
      <h3>Read this round</h3>
      <p class="sub">One match per line: <code>ARS vs MCI 1.90 3.40 3.80</code></p>
      <input id="file" type="file" accept="image/*"/>
      <img id="preview" class="preview hidden" alt="preview"/>
      <div class="field"><label>Fixtures</label><textarea id="fx" rows="8"></textarea></div>
      <button class="btn btn-orange" id="analyse">Analyse markets</button>
    </section>
    <section class="card"><h3>Market leans</h3><div id="result"><p class="sub">Nothing analysed yet.</p></div></section>
  </div>
  <div style="height:22px"></div>
  <section class="card"><h3>My slips</h3><div id="slipList"></div></section>
  <div style="height:22px"></div>
  <section class="card"><h3>Admin published tips</h3><div id="tipList"></div></section>
</main>
</div>
<script src="/api.js"></script>
<script>
let me, settings, imageName="";
(async()=>{
  try{
    const data=await api("/api/me");
    me=data.user; settings=data.settings;
  }catch{ location.href="/login.html"; return; }
  if(me.role!=="admin" && settings.requireFee && !me.paid){
    location.href = me.paymentStatus==="proof_sent" ? "/pending.html" : "/country.html";
    return;
  }
  if(settings.maintenance && me.role!=="admin"){
    document.body.innerHTML="<div class='auth-page'><div class='card'>Maintenance. Try later.</div></div>";
    return;
  }
  document.getElementById("hello").textContent="Hello, "+me.name;
  document.getElementById("meta").textContent=me.email;
  document.getElementById("support").href=settings.supportLink||"#";
  if(me.role==="admin") document.getElementById("adminLink").classList.remove("hidden");
  const gate=(!me.paid && settings.requireFee)?"Pay the registration fee, then ask admin to mark paid.":
    (me.status!=="active"?"Your account is "+me.status+". Wait for admin approval.":"");
  document.getElementById("gate").textContent=gate||settings.disclaimer;
  document.getElementById("kStatus").textContent=me.status+(me.paid?" · paid":" · unpaid");
  document.getElementById("kCredits").textContent=me.credits;
  document.getElementById("file").onchange=e=>{
    const f=e.target.files[0]; if(!f)return; imageName=f.name;
    const img=document.getElementById("preview"); img.src=URL.createObjectURL(f); img.classList.remove("hidden");
  };
  async function loadLists(){
    const {slips}=await api("/api/my/slips");
    document.getElementById("kSlips").textContent=slips.length;
    document.getElementById("slipList").innerHTML=slips.length
      ? `<table class="table"><tr><th>When</th><th>Matches</th><th>Leans</th></tr>${slips.map(s=>`<tr><td>${new Date(s.created_at).toLocaleString()}</td><td>${s.fixtures.length}</td><td>${s.leans.map(l=>l.pick).join(", ")}</td></tr>`).join("")}</table>`
      : "<p class='sub'>No slips yet.</p>";
    const {picks}=await api("/api/picks");
    document.getElementById("tipList").innerHTML=picks.length
      ? `<table class="table"><tr><th>Match</th><th>Tip</th><th>Odd</th><th>Note</th></tr>${picks.map(p=>`<tr><td>${p.match}</td><td>${p.selection}</td><td>${p.odd||""}</td><td>${p.note||""}</td></tr>`).join("")}</table>`
      : "<p class='sub'>No admin tips yet.</p>";
  }
  await loadLists();
  document.getElementById("analyse").onclick=async()=>{
    try{
      const slip=(await api("/api/analyse",{method:"POST",body:{fixturesText:document.getElementById("fx").value,imageName}})).slip;
      document.getElementById("result").innerHTML=slip.fixtures.map((fx,i)=>{
        const lean=slip.leans[i];
        return `<div class="row"><span>${fx.home} vs ${fx.away}<br><small>${fx.odds.home} / ${fx.odds.draw} / ${fx.odds.away}</small></span><span><b>${lean.pick}</b><br><small>${lean.impliedPct}% implied</small></span></div>`;
      }).join("")+`<p class="hint">${slip.leans[0]?slip.leans[0].note:""}</p>`;
      const fresh=(await api("/api/me")).user;
      document.getElementById("kCredits").textContent=fresh.credits;
      await loadLists();
    }catch(err){alert(err.message);}
  };
  document.getElementById("out").onclick=async()=>{ await api("/api/logout",{method:"POST"}); location.href="/"; };
})();
</script>
</body></html>
