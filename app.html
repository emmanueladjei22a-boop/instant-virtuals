<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predictions</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="desk-body">
  <header class="desk-top">
    <a class="brand" href="/"><span class="logo">iV</span> INSTANT <b>VIRTUALS</b></a>
    <div class="desk-actions">
      <a id="adminLink" class="hidden pill-link" href="/admin.html">Admin</a>
      <a class="pill-link" id="support" target="_blank">Support</a>
      <button class="pill-link" id="out">Out</button>
    </div>
  </header>
  <main class="desk">
    <p class="desk-hi" id="hello">Predictions</p>
    <p class="desk-sub" id="meta"></p>
    <div class="notice hidden" id="gate"></div>
    <div class="desk-kpis">
      <div><small>STATUS</small><b id="kStatus">—</b></div>
      <div><small>CREDITS</small><b id="kCredits">0</b></div>
      <div><small>TICKETS</small><b id="kSlips">0</b></div>
    </div>
    <section class="desk-card glow">
      <div class="desk-label">STEP 03 · ANALYSIS</div>
      <h2>Upload this round</h2>
      <p>Screenshot SportyBet Instant Football, then type each match.</p>
      <label class="dropzone fat" for="file">📷  Tap to add screenshot<br><small>PNG · JPG · WEBP</small></label>
      <input id="file" type="file" accept="image/*" hidden />
      <img id="preview" class="preview hidden" alt="preview" />
      <div class="field">
        <label>FIXTURES</label>
        <textarea id="fx" rows="5" placeholder="ARS vs MCI 1.90 3.40 3.80"></textarea>
      </div>
      <button class="btn btn-orange block" id="analyse">Analyse this round</button>
    </section>
    <section class="desk-card">
      <div class="desk-label">THIS ROUND</div>
      <h2>Market leans</h2>
      <div id="result"><p class="empty">Nothing analysed yet.</p></div>
    </section>
    <section class="desk-card">
      <div class="desk-label">DESK TIPS</div>
      <h2>Published by admin</h2>
      <div id="tipList"></div>
    </section>
    <section class="desk-card">
      <div class="desk-label">HISTORY</div>
      <h2>My tickets</h2>
      <div id="slipList"></div>
    </section>
  </main>
  <script src="/api.js"></script>
  <script>
    let me, settings, imageName = "";
    (async () => {
      try {
        const data = await api("/api/me");
        me = data.user; settings = data.settings;
      } catch { location.href = "/login.html"; return; }
      if (me.role !== "admin" && settings.requireFee && !me.paid) {
        location.href = me.paymentStatus === "proof_sent" ? "/pending.html" : "/country.html";
        return;
      }
      if (settings.maintenance && me.role !== "admin") {
        document.body.innerHTML = "<div class='auth-page'><div class='card'>Maintenance.</div></div>";
        return;
      }
      document.getElementById("hello").textContent = "Hi, " + me.name;
      document.getElementById("meta").textContent = "Instant Football desk";
      document.getElementById("support").href = settings.supportLink || "#";
      if (me.role === "admin") document.getElementById("adminLink").classList.remove("hidden");
      const gate = (!me.paid && settings.requireFee)
        ? "Pay the registration fee, then wait for approval."
        : (me.status !== "active" ? "Account is " + me.status : "");
      if (gate) {
        document.getElementById("gate").textContent = gate;
        document.getElementById("gate").classList.remove("hidden");
      }
      document.getElementById("kStatus").textContent = me.paid ? "ACTIVE" : me.status.toUpperCase();
      document.getElementById("kCredits").textContent = me.credits;
      document.getElementById("file").onchange = (e) => {
        const f = e.target.files[0]; if (!f) return; imageName = f.name;
        const img = document.getElementById("preview");
        img.src = URL.createObjectURL(f); img.classList.remove("hidden");
      };
      async function loadLists() {
        const { slips } = await api("/api/my/slips");
        document.getElementById("kSlips").textContent = slips.length;
        document.getElementById("slipList").innerHTML = slips.length
          ? slips.map((s) => `<div class="ticket-mini"><div>${new Date(s.created_at).toLocaleString()}</div><b>${(s.leans || []).map((l) => l.pick).join(" · ") || s.fixtures.length + " matches"}</b></div>`).join("")
          : "<p class='empty'>No tickets yet.</p>";
        const { picks } = await api("/api/picks");
        document.getElementById("tipList").innerHTML = picks.length
          ? picks.map((p) => `<div class="pick"><div><b>${p.match}</b><br><small>${p.note || "Admin tip"}</small></div><div class="pick-out">${p.selection}<small>${p.odd || ""}</small></div></div>`).join("")
          : "<p class='empty'>No published tips yet.</p>";
      }
      await loadLists();
      document.getElementById("analyse").onclick = async () => {
        try {
          const slip = (await api("/api/analyse", { method: "POST", body: { fixturesText: document.getElementById("fx").value, imageName } })).slip;
          document.getElementById("result").innerHTML = slip.fixtures.map((fx, i) => {
            const lean = slip.leans[i];
            return `<div class="ticket-row"><div class="teams">${fx.home} <span>vs</span> ${fx.away}</div><div class="odds">${fx.odds.home} · ${fx.odds.draw} · ${fx.odds.away}</div><div class="lean">${lean.pick} <em>@${lean.odd}</em></div></div>`;
          }).join("") + `<p class="hint">${slip.leans[0] ? slip.leans[0].note : ""}</p>`;
          document.getElementById("kCredits").textContent = (await api("/api/me")).user.credits;
          await loadLists();
        } catch (err) { alert(err.message); }
      };
      document.getElementById("out").onclick = async () => { await api("/api/logout", { method: "POST" }); location.href = "/"; };
    })();
  </script>
</body>
</html>
