<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Instant Football</title>
<link rel="stylesheet" href="/app.css"/>
</head>
<body class="desk-body">
<header class="desk-top">
  <a class="brand" href="/app.html">‹ Instant Football</a>
  <div class="desk-actions"><b id="gold">0</b> credit</div>
</header>
<main class="desk">
  <div class="desk-card glow">
    <div class="desk-label">DIAMOND WALLET</div>
    <h2 id="gold2">0</h2>
    <p>1 credit per prediction</p>
  </div>
  <div class="desk-card" id="upBox">
    <div class="desk-label">UPLOAD VGAMES SCREENSHOT</div>
    <label class="dropzone fat" for="file">Upload Screenshot<br><small>PNG, JPG — then tap GET PREDICTION</small></label>
    <input id="file" type="file" accept="image/*" hidden/>
    <img id="preview" class="preview hidden" alt=""/>
    <div class="field"><label>FIXTURES (if scan misses a line)</label>
      <textarea id="fx" rows="6" placeholder="FUL vs NEW 2.34 2.96 3.40
TOT vs LIV 4.48 3.21 1.90"></textarea>
    </div>
    <button class="btn btn-orange block" id="go">GET PREDICTION</button>
  </div>
  <div class="desk-card hidden" id="readBox">
    <img id="readImg" class="preview" alt=""/>
    <p class="desk-hi" id="pct">0%</p>
    <p>Reading Screenshot…</p>
    <p class="desk-sub">AI ANALYSIS RUNNING</p>
  </div>
  <div id="outList"></div>
</main>
<script src="/api.js"></script>
<script>
let imageName="";
(async()=>{
  const me=(await api("/api/me").catch(()=>null));
  if(!me) return location.replace("/login.html");
  document.getElementById("gold").textContent=me.user.credits;
  document.getElementById("gold2").textContent=me.user.credits;
})();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return; imageName=f.name;
  const url=URL.createObjectURL(f);
  document.getElementById("preview").src=url;
  document.getElementById("preview").classList.remove("hidden");
  document.getElementById("readImg").src=url;
};
document.getElementById("go").onclick=async()=>{
  document.getElementById("upBox").classList.add("hidden");
  document.getElementById("readBox").classList.remove("hidden");
  let n=0;
  await new Promise(res=>{
    const t=setInterval(()=>{ n+=7; if(n>=100){ n=100; clearInterval(t); res(); }
      document.getElementById("pct").textContent=n+"%"; }, 80);
  });
  try{
    const slip=(await api("/api/analyse",{method:"POST",body:{fixturesText:document.getElementById("fx").value,imageName}})).slip;
    document.getElementById("readBox").classList.add("hidden");
    document.getElementById("outList").innerHTML="<h2>YOUR PREDICTIONS ("+slip.fixtures.length+")</h2>"+
      slip.fixtures.map((fx,i)=>{
        const lean=slip.leans[i];
        const label=lean.pick==="Home"?"HOME WIN":lean.pick==="Away"?"AWAY WIN":"DRAW";
        return `<div class="pred-row"><b>${fx.home} vs ${fx.away}</b><span class="tag">${label}</span><small>${lean.impliedPct}% confidence</small></div>`;
      }).join("");
  }catch(err){
    document.getElementById("readBox").classList.add("hidden");
    document.getElementById("upBox").classList.remove("hidden");
    alert(err.message);
  }
};
</script>
</body>
</html>
