<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Buy diamonds</title>
<link rel="stylesheet" href="/app.css"/>
</head>
<body class="desk-body">
<header class="desk-top">
  <a class="brand" href="/app.html">‹ Packages</a>
  <div class="desk-actions"><b id="gold">0</b> ◆</div>
</header>
<main class="desk">
  <p class="desk-hi">Buy diamonds</p>
  <p class="desk-sub">Pick Regular, VIP or VVIP. Registration is separate.</p>
  <div class="desk-card" id="regular">
    <div class="desk-label">REGULAR</div>
    <h2 id="regQ">10 ◆</h2>
    <p id="regP">GH₵20</p>
    <a class="btn btn-orange block" href="/pay.html?buy=diamonds&pack=regular">BUY REGULAR</a>
  </div>
  <div class="desk-card glow">
    <div class="desk-label">VIP</div>
    <h2 id="vipQ">30 ◆</h2>
    <p id="vipP">GH₵50</p>
    <a class="btn btn-orange block" href="/pay.html?buy=diamonds&pack=vip">BUY VIP</a>
  </div>
  <div class="desk-card glow">
    <div class="desk-label">VVIP</div>
    <h2 id="vvipQ">80 ◆</h2>
    <p id="vvipP">GH₵100</p>
    <a class="btn btn-orange block" href="/pay.html?buy=diamonds&pack=vvip">BUY VVIP</a>
  </div>
</main>
<script src="/api.js"></script>
<script>
(async()=>{
  const d=await api("/api/me").catch(()=>null);
  if(!d) return location.replace("/login.html?next=/packages.html");
  const s=d.settings;
  document.getElementById("gold").textContent=d.user.credits||0;
  document.getElementById("regQ").textContent=(s.packRegularQty||10)+" ◆";
  document.getElementById("regP").textContent="GH₵"+(s.packRegularPrice||20);
  document.getElementById("vipQ").textContent=(s.packVipQty||30)+" ◆";
  document.getElementById("vipP").textContent="GH₵"+(s.packVipPrice||50);
  document.getElementById("vvipQ").textContent=(s.packVvipQty||80)+" ◆";
  document.getElementById("vvipP").textContent="GH₵"+(s.packVvipPrice||100);
})();
</script>
</body>
</html>
